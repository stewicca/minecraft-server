services:
    minecraft-server:
        image: itzg/minecraft-server:${TAG}
        container_name: minecraft-server
        tty: true
        stdin_open: true
        restart: unless-stopped
        environment:
            EULA: "TRUE"
            # Celestial Survival runs on Purpur, see install-celestial.sh
            TYPE: PURPUR
            FORCE_GAMEMODE: "TRUE"
            ENABLE_RCON: "TRUE"
            RCON_PORT: 25575
            RCON_PASSWORD: "${RCON_PASSWORD}"
            USE_AIKAR_FLAGS: "TRUE"
            # Vanilla+ datapacks: graves, head drops, creeper/enderman/ghast anti-grief
            VANILLATWEAKS_FILE: /extras/vanillatweaks.json
            # Re-applied on every start, so these settings are always in force.
            # Player permissions and ranks come from the Celestial LuckPerms setup.
            RCON_CMDS_STARTUP: |-
                gamerule players_sleeping_percentage 0
                execute in minecraft:the_nether run worldborder set 6250
                execute in minecraft:the_end run worldborder set 50000
                lp group default permission set essentials.back true
                lp group default permission set essentials.back.ondeath true
        env_file:
            - .env
        ports:
            - ${BEDROCK_PORT}:19132/udp
            - ${BEDROCK_PORT}:19132/tcp
            - ${JAVA_PORT}:25565/tcp
        volumes:
            - ./data:/data
            - ./extras:/extras:ro
        networks:
            - minecraft-network

    rcon-web-admin:
        image: itzg/rcon
        container_name: minecraft-rcon
        restart: unless-stopped
        environment:
            RWA_USERNAME: "${RCON_WEB_USER}"
            RWA_PASSWORD: "${RCON_WEB_PASSWORD}"
            RWA_RCON_HOST: minecraft-server
            RWA_RCON_PORT: 25575
            RWA_RCON_PASSWORD: "${RCON_PASSWORD}"
            RWA_ADMIN: "TRUE"
        ports:
            - ${RCON_WEB_PORT}:4326
            - 4327:4327
        depends_on:
            - minecraft-server
        networks:
            - minecraft-network

    playit:
        image: ghcr.io/playit-cloud/playit-agent:latest
        container_name: minecraft-playit
        restart: unless-stopped
        network_mode: host
        environment:
            SECRET_KEY: "${PLAYIT_SECRET}"

networks:
    minecraft-network:
        name: minecraft-network
        driver: bridge
