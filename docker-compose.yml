services:
    minecraft-server:
        image: itzg/minecraft-server:${TAG}
        container_name: minecraft-server
        tty: true
        stdin_open: true
        restart: unless-stopped
        environment:
            EULA: "TRUE"
            TYPE: PAPER
            FORCE_GAMEMODE: "TRUE"
            ENABLE_RCON: "TRUE"
            RCON_PORT: 25575
            RCON_PASSWORD: "${RCON_PASSWORD}"
        env_file:
            - .env
        ports:
            - ${BEDROCK_PORT}:19132/udp
            - ${BEDROCK_PORT}:19132/tcp
            - ${JAVA_PORT}:25565/tcp
        volumes:
            - ./data:/data
        networks:
            - minecraft-network

    rcon-web-admin:
        image: itzg/rcon
        container_name: minecraft-rcon
        restart: unless-stopped
        environment:
            RWA_USERNAME: "${RCON_WEB_USER}"
            RWA_PASSWORD: "${RCON_WEB_PASSWORD}"
            RWA_RCON_HOST: minecraft-server
            RWA_RCON_PORT: 25575
            RWA_RCON_PASSWORD: "${RCON_PASSWORD}"
            RWA_ADMIN: "TRUE"
        ports:
            - ${RCON_WEB_PORT}:4326
            - 4327:4327
        depends_on:
            - minecraft-server
        networks:
            - minecraft-network

    playit:
        image: ghcr.io/playit-cloud/playit-agent:latest
        container_name: minecraft-playit
        restart: unless-stopped
        network_mode: host
        environment:
            SECRET_KEY: "${PLAYIT_SECRET}"

networks:
    minecraft-network:
        name: minecraft-network
        driver: bridge
